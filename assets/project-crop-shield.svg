<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="150" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&amp;display=swap');
    .font-outfit {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .project-title {
      font-size: 18px;
      font-weight: 800;
      fill: #ffffff;
    }
    .project-desc {
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-bg {
      fill: #1e293b;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 1;
    }
    .badge-text {
      font-size: 11px;
      font-weight: 500;
      fill: #3b82f6;
    }
    .action-bg {
      fill: #06b6d4;
      fill-opacity: 0.1;
      stroke: #06b6d4;
      stroke-opacity: 0.3;
      stroke-width: 1;
    }
    .action-text {
      font-size: 12px;
      font-weight: 600;
      fill: #06b6d4;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="148" rx="16" class="card-bg" />

  <!-- Content Group -->
  <g class="font-outfit" transform="translate(32, 28)">
    <!-- Folder Icon / Graphic -->
    <path d="M 0 5 c 0 -1.1 0.9 -2 2 -2 h 6 l 3 3 h 13 c 1.1 0 2 0.9 2 2 v 12 c 0 1.1 -0.9 2 -2 2 h -22 c -1.1 0 -2 -0.9 -2 -2 Z" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="36" y="16" class="project-title">Crop Shield</text>
    
    <!-- Description -->
    <text x="0" y="48" class="project-desc">AI-based Crop Disease Prediction and Management. Employs image-recognition models to</text>
    <text x="0" y="68" class="project-desc">detect plant foliage diseases, helping farmers identify foliage infections and apply localized cures.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 88)">
      <!-- Python Badge -->
      <rect width="60" height="22" rx="11" class="badge-bg" />
      <text x="30" y="15" text-anchor="middle" class="badge-text" fill="#ffdd54">Python</text>

      <!-- PyTorch Badge -->
      <g transform="translate(68, 0)">
        <rect width="68" height="22" rx="11" class="badge-bg" />
        <text x="34" y="15" text-anchor="middle" class="badge-text" fill="#EE4C2C">PyTorch</text>
      </g>

      <!-- OpenCV Badge -->
      <g transform="translate(144, 0)">
        <rect width="68" height="22" rx="11" class="badge-bg" />
        <text x="34" y="15" text-anchor="middle" class="badge-text" fill="#a855f7">OpenCV</text>
      </g>

      <!-- Streamlit Badge -->
      <g transform="translate(220, 0)">
        <rect width="76" height="22" rx="11" class="badge-bg" />
        <text x="38" y="15" text-anchor="middle" class="badge-text" fill="#FE4B4B">Streamlit</text>
      </g>
    </g>

    <!-- Action Button (Right Aligned) -->
    <g transform="translate(560, 32)">
      <rect width="130" height="32" rx="16" class="action-bg" />
      <text x="65" y="20" text-anchor="middle" class="action-text">View Repository →</text>
    </g>
  </g>
</svg>
