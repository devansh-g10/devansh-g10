<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="150" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    
    .project-title {
      font-size: 18px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    
    .project-desc {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    
    .badge-bg {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    
    .badge-text {
      font-size: 11px;
      font-weight: 500;
    }
    
    .action-bg {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1;
    }
    
    .action-text {
      font-size: 12px;
      font-weight: 500;
      fill: #FFFFFF;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="148" rx="12" class="card-bg" />

  <!-- Content Group -->
  <g class="font-inter" transform="translate(32, 28)">
    <!-- Folder Icon / Graphic -->
    <path d="M 0 5 c 0 -1.1 0.9 -2 2 -2 h 6 l 3 3 h 13 c 1.1 0 2 0.9 2 2 v 12 c 0 1.1 -0.9 2 -2 2 h -22 c -1.1 0 -2 -0.9 -2 -2 Z" fill="#0070F3" fill-opacity="0.15" stroke="#0070F3" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="36" y="16" class="project-title">Crop Shield</text>
    
    <!-- Description -->
    <text x="0" y="48" class="project-desc">AI-based Crop Disease Prediction and Management. Employs image-recognition models to</text>
    <text x="0" y="68" class="project-desc">detect plant foliage diseases, helping farmers identify foliage infections and apply localized cures.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 92)">
      <!-- Python Badge -->
      <rect width="60" height="24" rx="12" class="badge-bg" />
      <text x="30" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Python</text>

      <!-- PyTorch Badge -->
      <g transform="translate(68, 0)">
        <rect width="68" height="24" rx="12" class="badge-bg" />
        <text x="34" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">PyTorch</text>
      </g>

      <!-- OpenCV Badge -->
      <g transform="translate(144, 0)">
        <rect width="68" height="24" rx="12" class="badge-bg" />
        <text x="34" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">OpenCV</text>
      </g>

      <!-- Streamlit Badge -->
      <g transform="translate(220, 0)">
        <rect width="76" height="24" rx="12" class="badge-bg" />
        <text x="38" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Streamlit</text>
      </g>
    </g>

    <!-- Action Button (Right Aligned) -->
    <g transform="translate(560, 32)">
      <rect width="130" height="32" rx="16" class="action-bg" />
      <text x="65" y="21" text-anchor="middle" class="action-text">View Repository →</text>
    </g>
  </g>
</svg>
