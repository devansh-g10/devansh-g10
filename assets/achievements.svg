<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 1px;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .item-desc {
      font-size: 12px;
      font-weight: 400;
      fill: #888888;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="178" rx="12" class="card-bg" />

  <!-- Content Group -->
  <g class="font-inter" transform="translate(32, 28)">
    <!-- Header Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 6 a 5 5 0 0 1 10 0 v 4 a 1 1 0 0 1 -1 1 h -8 a 1 1 0 0 1 -1 -1 z M 2 11 v 2 h 6 v -2 z M 0 14 h 10 v 1 h -10 z" fill="#7928CA" />
      <text x="22" y="12" class="card-title">ACHIEVEMENTS &amp; MILESTONES</text>
    </g>

    <!-- Grid of 4 Items (2x2 Layout) -->
    <!-- Column 1, Row 1 -->
    <g transform="translate(0, 40)">
      <circle cx="10" cy="15" r="5" fill="#0070F3" opacity="0.3" />
      <circle cx="10" cy="15" r="3" fill="#0070F3" />
      <text x="24" y="14" class="item-title">🏆 Hackathons &amp; Competitions</text>
      <text x="24" y="32" class="item-desc">Active participant &amp; developer in university-level &amp; national hackathons.</text>
    </g>

    <!-- Column 2, Row 1 -->
    <g transform="translate(380, 40)">
      <circle cx="10" cy="15" r="5" fill="#00E5FF" opacity="0.3" />
      <circle cx="10" cy="15" r="3" fill="#00E5FF" />
      <text x="24" y="14" class="item-title">🌐 Open Source Contribution</text>
      <text x="24" y="32" class="item-desc">Contributed tools to GitHub Java ecosystems &amp; collaborative AI setups.</text>
    </g>

    <!-- Column 1, Row 2 -->
    <g transform="translate(0, 100)">
      <circle cx="10" cy="15" r="5" fill="#7928CA" opacity="0.3" />
      <circle cx="10" cy="15" r="3" fill="#7928CA" />
      <text x="24" y="14" class="item-title">🤖 Intelligent AI Systems</text>
      <text x="24" y="32" class="item-desc">Engineered Crop Foliage diagnostics model and Audio deepfake detector.</text>
    </g>

    <!-- Column 2, Row 2 -->
    <g transform="translate(380, 100)">
      <circle cx="10" cy="15" r="5" fill="#0070F3" opacity="0.3" />
      <circle cx="10" cy="15" r="3" fill="#0070F3" />
      <text x="24" y="14" class="item-title">🏅 Technical Certifications</text>
      <text x="24" y="32" class="item-desc">Certified in Advanced DSA architectures, ML pipelines, and Cloud structures.</text>
    </g>
  </g>
</svg>
