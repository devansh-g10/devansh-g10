<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap');
    .font-outfit {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      fill: url(#title-grad);
      letter-spacing: 1.5;
    }
    .card-text {
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .highlight {
      fill: #ffffff;
      font-weight: 600;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="380" height="180" rx="16" class="card-bg" />

  <!-- Content -->
  <g class="font-outfit" transform="translate(24, 32)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 0 l 12 4 l -4 8 l -8 -12 M 6 6 l 6 6" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="10" class="card-title">CURRENT FOCUS</text>
    </g>

    <!-- Bio Text -->
    <g transform="translate(0, 32)" class="card-text">
      <text x="0" y="15">🤖 Building <tspan class="highlight">ForensightAI</tspan> &amp; training ML models.</text>
      <text x="0" y="37">📈 Solving DSA challenges daily on <tspan class="highlight">LeetCode</tspan>.</text>
      <text x="0" y="59">☁️ Exploring backend architecture on <tspan class="highlight">AWS</tspan>.</text>
      <text x="0" y="81">🌱 Deepening understanding of neural architectures,</text>
      <text x="0" y="103">transformer networks, and cloud deployment pipelines.</text>
    </g>
  </g>
</svg>
