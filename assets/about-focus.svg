<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .card-text {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    .highlight {
      fill: #FFFFFF;
      font-weight: 600;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="378" height="178" rx="16" class="card-bg" />

  <!-- Content -->
  <g class="font-inter" transform="translate(24, 32)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 0 l 12 4 l -4 8 l -8 -12 M 6 6 l 6 6" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="10" class="card-title">CURRENT FOCUS</text>
    </g>

    <!-- Bio Text -->
    <g transform="translate(0, 32)" class="card-text">
      <text x="0" y="15">🤖 Building <tspan class="highlight">ForensightAI</tspan> &amp; training ML models.</text>
      <text x="0" y="37">📈 Solving DSA challenges daily on <tspan class="highlight">LeetCode</tspan>.</text>
      <text x="0" y="59">☁️ Exploring backend architecture on <tspan class="highlight">AWS</tspan>.</text>
      <text x="0" y="81">🌱 Deepening understanding of neural architectures,</text>
      <text x="0" y="103">transformer networks, and cloud deployment pipelines.</text>
    </g>
  </g>
</svg>
