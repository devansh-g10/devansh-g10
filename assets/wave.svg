<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100" fill="none">
  <style>
    .wave-path {
      fill-opacity: 0.15;
    }
    
    @keyframes wave-move-1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes wave-move-2 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes wave-move-3 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }

    .w1 {
      animation: wave-move-1 14s infinite linear;
      fill: url(#wave-cyan-grad);
    }
    .w2 {
      animation: wave-move-2 18s infinite linear;
      fill: url(#wave-purple-grad);
      opacity: 0.8;
    }
    .w3 {
      animation: wave-move-3 22s infinite linear;
      fill: url(#wave-blue-grad);
      opacity: 0.9;
    }
  </style>

  <defs>
    <!-- Cyan Wave Gradient -->
    <linearGradient id="wave-cyan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>
    
    <!-- Purple Wave Gradient -->
    <linearGradient id="wave-purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>

    <!-- Blue Wave Gradient -->
    <linearGradient id="wave-blue-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dark container background -->
  <rect width="800" height="100" fill="#050505" />

  <!-- Wave 1 (Back, Cyan) -->
  <g>
    <path class="wave-path w1" d="M 0,55 Q 100,40 200,55 T 400,55 T 600,55 T 800,55 T 1000,55 T 1200,55 T 1400,55 T 1600,55 L 1600,100 L 0,100 Z" />
  </g>

  <!-- Wave 2 (Middle, Purple) -->
  <g transform="translate(-120, 0)">
    <path class="wave-path w2" d="M 0,60 Q 100,48 200,60 T 400,60 T 600,60 T 800,60 T 1000,60 T 1200,60 T 1400,60 T 1600,60 L 1600,100 L 0,100 Z" />
  </g>

  <!-- Wave 3 (Front, Blue) -->
  <g transform="translate(-250, 0)">
    <path class="wave-path w3" d="M 0,50 Q 100,32 200,50 T 400,50 T 600,50 T 800,50 T 1000,50 T 1200,50 T 1400,50 T 1600,50 L 1600,100 L 0,100 Z" />
  </g>
</svg>
