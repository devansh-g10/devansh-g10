<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&amp;display=swap');
    .btn-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #ffffff;
    }
    .btn-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .icon {
      fill: #ea4335;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Button background -->
  <rect x="1" y="1" width="138" height="38" rx="19" class="btn-bg" />

  <!-- Email Icon -->
  <path class="icon" d="M 20 13 c -1.1 0 -2 0.9 -2 2 v 10 c 0 1.1 0.9 2 2 2 h 12 c 1.1 0 2 -0.9 2 -2 v -10 c 0 -1.1 -0.9 -2 -2 -2 H 20 z M 20.8 15 h 10.4 l -5.2 3.8 L 20.8 15 z M 19.5 16.5 l 6 4.3 c 0.3 0.2 0.7 0.2 1 0 l 6 -4.3 v 8.5 c 0 0.3 -0.2 0.5 -0.5 0.5 H 20 c -0.3 0 -0.5 -0.2 -0.5 -0.5 v -8.5 z" />

  <!-- Button text -->
  <text x="52" y="24" class="btn-text">Email</text>
</svg>
