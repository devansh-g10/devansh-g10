<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="150" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    
    .project-title {
      font-size: 18px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    
    .project-desc {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    
    .badge-bg {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    
    .badge-text {
      font-size: 11px;
      font-weight: 500;
    }
    
    .action-bg {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1;
    }
    
    .action-text {
      font-size: 12px;
      font-weight: 500;
      fill: #FFFFFF;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="148" rx="12" class="card-bg" />

  <!-- Content Group -->
  <g class="font-inter" transform="translate(32, 28)">
    <!-- Shield Icon -->
    <path d="M 12 3 L 2 7 v 6 c 0 5.5 4.5 10 10 10 s 10 -4.5 10 -10 V 7 L 12 3 Z" fill="#7928CA" fill-opacity="0.15" stroke="#7928CA" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="36" y="16" class="project-title">Forensight AI</text>
    
    <!-- Description -->
    <text x="0" y="48" class="project-desc">Advanced Deepfake Image &amp; Audio Forensics. Analyzes image compression anomalies and</text>
    <text x="0" y="68" class="project-desc">detects acoustic frequency deviations in audio streams using trained CNN models.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 92)">
      <!-- Python Badge -->
      <rect width="60" height="24" rx="12" class="badge-bg" />
      <text x="30" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Python</text>

      <!-- TensorFlow Badge -->
      <g transform="translate(68, 0)">
        <rect width="88" height="24" rx="12" class="badge-bg" />
        <text x="44" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">TensorFlow</text>
      </g>

      <!-- Flask Badge -->
      <g transform="translate(164, 0)">
        <rect width="55" height="24" rx="12" class="badge-bg" />
        <text x="27.5" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Flask</text>
      </g>

      <!-- Librosa Badge -->
      <g transform="translate(227, 0)">
        <rect width="65" height="24" rx="12" class="badge-bg" />
        <text x="32.5" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Librosa</text>
      </g>
    </g>

    <!-- Action Button (Right Aligned) -->
    <g transform="translate(560, 32)">
      <rect width="130" height="32" rx="16" class="action-bg" />
      <text x="65" y="21" text-anchor="middle" class="action-text">View Repository →</text>
    </g>
  </g>
</svg>
