<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="150" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&amp;display=swap');
    .font-outfit {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .project-title {
      font-size: 18px;
      font-weight: 800;
      fill: #ffffff;
    }
    .project-desc {
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-bg {
      fill: #1e293b;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 1;
    }
    .badge-text {
      font-size: 11px;
      font-weight: 500;
      fill: #3b82f6;
    }
    .action-bg {
      fill: #06b6d4;
      fill-opacity: 0.1;
      stroke: #06b6d4;
      stroke-opacity: 0.3;
      stroke-width: 1;
    }
    .action-text {
      font-size: 12px;
      font-weight: 600;
      fill: #06b6d4;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="148" rx="16" class="card-bg" />

  <!-- Content Group -->
  <g class="font-outfit" transform="translate(32, 28)">
    <!-- Shield Icon -->
    <path d="M 12 3 L 2 7 v 6 c 0 5.5 4.5 10 10 10 s 10 -4.5 10 -10 V 7 L 12 3 Z" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="36" y="16" class="project-title">Forensight AI</text>
    
    <!-- Description -->
    <text x="0" y="48" class="project-desc">Advanced Deepfake Image &amp; Audio Forensics. Analyzes image compression anomalies and</text>
    <text x="0" y="68" class="project-desc">detects acoustic frequency deviations in audio streams using trained CNN models.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 88)">
      <!-- Python Badge -->
      <rect width="60" height="22" rx="11" class="badge-bg" />
      <text x="30" y="15" text-anchor="middle" class="badge-text" fill="#ffdd54">Python</text>

      <!-- TensorFlow Badge -->
      <g transform="translate(68, 0)">
        <rect width="88" height="22" rx="11" class="badge-bg" />
        <text x="44" y="15" text-anchor="middle" class="badge-text" fill="#FF6F00">TensorFlow</text>
      </g>

      <!-- Flask Badge -->
      <g transform="translate(164, 0)">
        <rect width="55" height="22" rx="11" class="badge-bg" />
        <text x="27.5" y="15" text-anchor="middle" class="badge-text" fill="#e2e8f0">Flask</text>
      </g>

      <!-- Librosa Badge -->
      <g transform="translate(227, 0)">
        <rect width="65" height="22" rx="11" class="badge-bg" />
        <text x="32.5" y="15" text-anchor="middle" class="badge-text" fill="#06b6d4">Librosa</text>
      </g>
    </g>

    <!-- Action Button (Right Aligned) -->
    <g transform="translate(560, 32)">
      <rect width="130" height="32" rx="16" class="action-bg" />
      <text x="65" y="20" text-anchor="middle" class="action-text">View Repository →</text>
    </g>
  </g>
</svg>
