<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&amp;display=swap');
    .btn-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #ffffff;
    }
    .btn-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .icon {
      fill: #0077b5;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b5" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Button background -->
  <rect x="1" y="1" width="138" height="38" rx="19" class="btn-bg" />

  <!-- LinkedIn Icon -->
  <path class="icon" d="M 22 14 h 3.5 v 12 h -3.5 z M 23.75 10 c -1.1 0 -1.75 0.7 -1.75 1.7 s 0.65 1.7 1.7 1.7 s 1.75 -0.7 1.75 -1.7 s -0.65 -1.7 -1.75 -1.7 z M 27.5 14 h 3.5 v 1.8 c 0.5 -0.8 1.4 -1.8 2.8 -1.8 c 2.3 0 3.2 1.4 3.2 3.8 v 8.2 h -3.5 v -6.8 c 0 -1.5 -0.5 -2.2 -1.5 -2.2 c -0.8 0 -1.4 0.5 -1.6 1.4 v 7.6 h -3.5 z" />

  <!-- Button text -->
  <text x="50" y="24" class="btn-text">LinkedIn</text>
</svg>
