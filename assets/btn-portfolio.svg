      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Button background -->
  <rect x="1" y="1" width="138" height="38" rx="19" class="btn-bg" />

  <!-- Portfolio (Globe) Icon -->
  <path class="icon" d="M 24 12 c -4.4 0 -8 3.6 -8 8 s 3.6 8 8 8 s 8 -3.6 8 -8 s -3.6 -8 -8 -8 z M 24 13.5 c 0.8 0 1.5 1.5 1.8 3.5 h -3.6 c 0.3 -2 1 -3.5 1.8 -3.5 z M 24 26.5 c -0.8 0 -1.5 -1.5 -1.8 -3.5 h 3.6 c -0.3 2 -1 3.5 -1.8 3.5 z M 17.6 20 c 0 -0.6 0.1 -1.3 0.2 -2 h 2.4 c -0.1 0.7 -0.2 1.3 -0.2 2 s 0.1 1.3 0.2 2 h -2.4 c -0.1 -0.7 -0.2 -1.3 -0.2 -2 z M 21.7 20 c 0 -0.6 0.1 -1.3 0.2 -2 h 4.2 c 0.1 0.7 0.2 1.3 0.2 2 s -0.1 1.3 -0.2 2 h -4.2 c -0.1 -0.7 -0.2 -1.3 -0.2 -2 z M 27.8 20 c 0 -0.6 0.1 -1.3 0.2 -2 h 2.4 c -0.1 0.7 -0.2 1.3 -0.2 2 s 0.1 1.3 0.2 2 h -2.4 c -0.1 -0.7 -0.2 -1.3 -0.2 -2 z" />

