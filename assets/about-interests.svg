<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .card-text {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    .highlight {
      fill: #FFFFFF;
      font-weight: 600;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="378" height="178" rx="16" class="card-bg" />

  <!-- Content -->
  <g class="font-inter" transform="translate(24, 32)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 6 a 5 5 0 0 1 10 0 c 0 4 -5 8 -5 8 s -5 -4 -5 -8 Z" fill="#E2E8F0" />
      <text x="24" y="10" class="card-title">INTERESTS &amp; FUN FACT</text>
    </g>

    <!-- Bio Text -->
    <g transform="translate(0, 32)" class="card-text">
      <text x="0" y="15">🧠 Interested in <tspan class="highlight">Computer Vision</tspan> &amp; NLP.</text>
      <text x="0" y="37">💻 Enjoys clean system code and optimizing logic.</text>
      <text x="0" y="59">⚡ Fun fact: I enjoy solving coding problems</text>
      <text x="18" y="76">more than watching movies! 😄</text>
      <text x="0" y="98">☕ Fuelled by curiosity, logic, and coffee.</text>
    </g>
  </g>
</svg>
