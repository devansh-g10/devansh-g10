<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .card-text {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    .highlight {
      fill: #FFFFFF;
      font-weight: 600;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="378" height="178" rx="16" class="card-bg" />

  <!-- Content -->
  <g class="font-inter" transform="translate(24, 32)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 6 a 3 3 0 0 1 6 0 a 3 3 0 0 1 -6 0 M 10 6 a 3 3 0 0 1 6 0 a 3 3 0 0 1 -6 0 M 1 12 c 0 -2 2 -3 4 -3 s 4 1 4 3 M 9 12 c 0 -2 2 -3 4 -3 s 4 1 4 3" fill="#7928CA" />
      <text x="24" y="10" class="card-title">COLLABORATION</text>
    </g>

    <!-- Bio Text -->
    <g transform="translate(0, 32)" class="card-text">
      <text x="0" y="15">👯 Open to collaborate on <tspan class="highlight">AI/ML projects</tspan>.</text>
      <text x="0" y="37">🤝 Seeking guidance on <tspan class="highlight">System Design</tspan> &amp; Scaling.</text>
      <text x="0" y="59">🌱 Open Source &amp; hackathon collaborations.</text>
      <text x="0" y="81">💬 Ask me about <tspan class="highlight">Java, DSA</tspan>, and training models.</text>
      <text x="0" y="103">📧 Hit me up for research or development builds.</text>
    </g>
  </g>
</svg>
