<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap');
    .font-outfit {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      fill: url(#title-grad);
      letter-spacing: 1.5;
    }
    .card-text {
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .highlight {
      fill: #ffffff;
      font-weight: 600;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="380" height="180" rx="16" class="card-bg" />

  <!-- Content -->
  <g class="font-outfit" transform="translate(24, 32)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 6 a 3 3 0 0 1 6 0 a 3 3 0 0 1 -6 0 M 10 6 a 3 3 0 0 1 6 0 a 3 3 0 0 1 -6 0 M 1 12 c 0 -2 2 -3 4 -3 s 4 1 4 3 M 9 12 c 0 -2 2 -3 4 -3 s 4 1 4 3" fill="#8b5cf6" />
      <text x="24" y="10" class="card-title">COLLABORATION</text>
    </g>

    <!-- Bio Text -->
    <g transform="translate(0, 32)" class="card-text">
      <text x="0" y="15">👯 Open to collaborate on <tspan class="highlight">AI/ML projects</tspan>.</text>
      <text x="0" y="37">🤝 Seeking guidance on <tspan class="highlight">System Design</tspan> &amp; Scaling.</text>
      <text x="0" y="59">🌱 Open Source &amp; hackathon collaborations.</text>
      <text x="0" y="81">💬 Ask me about <tspan class="highlight">Java, DSA</tspan>, and training models.</text>
      <text x="0" y="103">📧 Hit me up for research or development builds.</text>
    </g>
  </g>
</svg>
