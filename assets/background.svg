<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" fill="none">
  <style>
    .grid {
      stroke: rgba(255, 255, 255, 0.03);
      stroke-width: 1;
    }
    .glow-blue {
      filter: blur(80px);
      opacity: 0.15;
    }
    .glow-purple {
      filter: blur(80px);
      opacity: 0.15;
    }
  </style>

  <!-- Dark Background -->
  <rect width="800" height="200" fill="#050505" />

  <!-- Radial Glows -->
  <circle cx="150" cy="100" r="120" fill="#0070F3" class="glow-blue" />
  <circle cx="650" cy="120" r="100" fill="#7928CA" class="glow-purple" />
  <circle cx="400" cy="50" r="80" fill="#00E5FF" class="glow-blue" />

  <!-- Grid Pattern -->
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>
  
  <rect width="800" height="200" fill="url(#gridPattern)" />

  <!-- Soft gradient borders -->
  <rect x="0.5" y="0.5" width="799" height="199" rx="8" stroke="url(#borderGrad)" stroke-opacity="0.3" fill="none" />

  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>
</svg>
