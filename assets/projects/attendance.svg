<svg xmlns="http://www.w3.org/2000/svg" width="668" height="152" viewBox="0 0 668 152" role="img" aria-labelledby="title desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="title">Smart Attendance</title><desc id="desc">Recognize faces, record class attendance and export reports by student or date. Python · OpenCV · Flask · MySQL</desc>
<defs>
