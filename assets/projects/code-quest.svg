<svg xmlns="http://www.w3.org/2000/svg" width="668" height="152" viewBox="0 0 668 152" role="img" aria-labelledby="title desc" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="title">Code Quest</title><desc id="desc">A full-stack coding challenge platform for practising programming problems. React · Vite · Express · MongoDB</desc>
<defs>
  <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#14273d"/><stop offset=".48" stop-color="#0b182a"/><stop offset="1" stop-color="#17172e"/></linearGradient>
  <linearGradient id="spectrum"><stop stop-color="#70f5e4"/><stop offset=".55" stop-color="#72a1ff"/><stop offset="1" stop-color="#bd9bff"/></linearGradient>
  <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#45627a"/></pattern>
</defs>
<style>
  @keyframes pulse {50% {opacity:.38}}
  @keyframes flow {to {stroke-dashoffset:-80}}
  @keyframes float {50% {transform:translateY(-4px)}}
  @media (prefers-reduced-motion:no-preference) {
    .pulse {animation:pulse 4s ease-in-out infinite}
    .flow {animation:flow 12s linear infinite}
    .float {animation:float 6s ease-in-out infinite}
  }
  @keyframes scanline {50% {transform:translateY(18px)}} @media (prefers-reduced-motion:no-preference){.scan {animation:scanline 4s ease-in-out infinite}}
  @media (prefers-reduced-motion:reduce) {* {animation:none!important}}
</style>
