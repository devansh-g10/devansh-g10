<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');
    
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .glow-bg {
      filter: blur(90px);
      opacity: 0.15;
    }
    
    .grid-mesh {
      stroke: rgba(255, 255, 255, 0.03);
      stroke-width: 1;
    }

    /* Typing Text Keyframes */
    @keyframes fade-1 {
      0%, 20% { opacity: 1; transform: translateY(0); }
      25%, 95% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-2 {
      0%, 20% { opacity: 0; transform: translateY(-5px); }
      25%, 45% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(5px); }
    }
    @keyframes fade-3 {
      0%, 45% { opacity: 0; transform: translateY(-5px); }
      50%, 70% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(5px); }
    }
    @keyframes fade-4 {
      0%, 70% { opacity: 0; transform: translateY(-5px); }
      75%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(5px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .role-1 { animation: fade-1 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .role-2 { animation: fade-2 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .role-3 { animation: fade-3 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .role-4 { animation: fade-4 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .cursor { animation: blink 1s infinite; fill: #0070F3; font-weight: bold; }

    /* Floating illustration nodes */
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .floating-art {
      animation: float-node 8s infinite ease-in-out;
      transform-origin: center;
    }
    
    .glass-card {
      fill: #111111;
      fill-opacity: 0.7;
      stroke: url(#card-border-grad);
      stroke-width: 1;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
    }

    .badge {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
  </style>

  <!-- Global background -->
  <rect width="800" height="320" fill="#050505" />

  <!-- Ambient Glows -->
  <circle cx="150" cy="160" r="140" fill="#0070F3" class="glow-bg" />
  <circle cx="650" cy="140" r="140" fill="#7928CA" class="glow-bg" />
  <circle cx="400" cy="280" r="100" fill="#00E5FF" class="glow-bg" />

  <!-- Mesh Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-mesh" />
    </pattern>
    
    <!-- Gradient for Card Border -->
    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Gradient for Text -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    
    <!-- Gradient for Subtitle -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>

    <!-- Neural gradient -->
    <linearGradient id="neural-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="320" fill="url(#grid)" />

  <!-- Left Side: Hero Info -->
  <g class="font-inter" transform="translate(50, 0)">
    <!-- Small Tagline Badge -->
    <rect x="0" y="80" width="130" height="24" rx="12" class="badge" />
    <text x="65" y="96" fill="#A1A1AA" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">HELLO WORLD</text>
    
    <!-- Large Name -->
    <text x="0" y="145" fill="url(#text-grad)" font-size="44" font-weight="800" letter-spacing="-1.5">Devansh Maheshwari</text>
    
    <!-- Animated typing subtitle -->
    <g font-size="20" font-weight="600" fill="url(#sub-grad)">
      <text x="0" y="190" class="role-1">AI/ML Developer<tspan class="cursor">|</tspan></text>
      <text x="0" y="190" class="role-2">Java Developer<tspan class="cursor">|</tspan></text>
      <text x="0" y="190" class="role-3">Competitive Programmer<tspan class="cursor">|</tspan></text>
      <text x="0" y="190" class="role-4">Open Source Contributor<tspan class="cursor">|</tspan></text>
    </g>

    <!-- Short bio context -->
    <text x="0" y="235" fill="#888888" font-size="14" font-weight="400" width="350" letter-spacing="-0.2">
      Crafting elegant code solutions and training intelligent models.
    </text>
    <text x="0" y="255" fill="#888888" font-size="14" font-weight="400" letter-spacing="-0.2">
      Bridging engineering excellence and machine intelligence.
    </text>
  </g>

  <!-- Right Side: Glassmorphic Status Card -->
  <g transform="translate(480, 45)" class="font-inter">
    <!-- Card Frame -->
    <rect width="270" height="230" rx="16" class="glass-card" />
    
    <!-- Abstract Networking Graphic -->
    <g class="floating-art" opacity="0.8">
      <!-- Connection lines -->
      <path d="M 70 50 L 135 35 L 200 70 L 150 105 Z" fill="none" stroke="url(#neural-grad)" stroke-width="1.5" stroke-dasharray="4 2" />
      <line x1="135" y1="35" x2="150" y2="105" stroke="#7928CA" stroke-width="1" />
      
      <!-- Nodes with outer glow effect -->
      <circle cx="70" cy="50" r="10" fill="#00E5FF" opacity="0.2" />
      <circle cx="70" cy="50" r="4" fill="#00E5FF" />
      
      <circle cx="135" cy="35" r="10" fill="#0070F3" opacity="0.2" />
      <circle cx="135" cy="35" r="4" fill="#0070F3" />
      
      <circle cx="200" cy="70" r="12" fill="#7928CA" opacity="0.2" />
      <circle cx="200" cy="70" r="5" fill="#7928CA" />
      
      <circle cx="150" cy="105" r="10" fill="#00E5FF" opacity="0.2" />
      <circle cx="150" cy="105" r="4" fill="#00E5FF" />
    </g>

    <!-- Card Info Content -->
    <g transform="translate(24, 45)">
      <!-- Title -->
      <text x="0" y="0" font-weight="700" fill="#FFFFFF" font-size="14" letter-spacing="1">DEVELOPER STATUS</text>
      <rect x="0" y="10" width="30" height="2" fill="#0070F3" rx="1" />
      
      <!-- Details -->
      <g transform="translate(0, 35)" font-size="13" font-weight="400" fill="#A1A1AA">
        <text x="0" y="15">🎓 Education:</text>
        <text x="20" y="32" font-weight="600" fill="#FFFFFF">B.Tech CSE</text>
        <text x="20" y="47" font-weight="400" fill="#888888">GLA University</text>

        <text x="0" y="80">🚀 Current Focus:</text>
        <text x="20" y="97" font-weight="600" fill="#00E5FF">AI/ML &amp; Adv. DSA</text>
        
        <text x="0" y="130">📍 Location:</text>
        <text x="20" y="147" font-weight="600" fill="#FFFFFF">India</text>
      </g>
    </g>
  </g>
</svg>
