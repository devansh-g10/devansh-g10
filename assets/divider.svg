<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="100%" height="6" fill="none">
  <defs>
    <!-- Moving linear gradient -->
    <linearGradient id="moving-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="20%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
      
      <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Static dark background line -->
    <linearGradient id="dark-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="15%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#334155" stop-opacity="1" />
      <stop offset="85%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Line -->
  <line x1="0" y1="3" x2="800" y2="3" stroke="url(#dark-line)" stroke-width="1" />

  <!-- Animated Glowing Streak Line -->
  <line x1="0" y1="3" x2="800" y2="3" stroke="url(#moving-glow)" stroke-width="1.8" />
</svg>
