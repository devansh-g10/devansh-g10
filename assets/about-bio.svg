<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .card-text {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    .highlight {
      fill: #FFFFFF;
      font-weight: 600;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="378" height="178" rx="16" class="card-bg" />

  <!-- Content -->
  <g class="font-inter" transform="translate(24, 32)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <path d="M 0 5 a 6 6 0 1 1 12 0 a 6 6 0 0 1 -12 0 M -3 15 c 0 -4 4 -6 9 -6 s 9 2 9 6 v 2 h -18 z" fill="#0070F3" />
      <text x="24" y="10" class="card-title">ABOUT ME</text>
    </g>

    <!-- Bio Text -->
    <g transform="translate(0, 32)" class="card-text">
      <text x="0" y="15">Pursuing <tspan class="highlight">B.Tech CSE</tspan> at GLA University.</text>
      <text x="0" y="37">Passionate about algorithmic problem solving</text>
      <text x="0" y="59">and creating intelligent backend architectures.</text>
      <text x="0" y="81">Dedicated to writing clean, maintainable, and</text>
      <text x="0" y="103">production-ready code. Excellent communicator.</text>
    </g>
  </g>
</svg>
