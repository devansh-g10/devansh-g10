<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="150" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .card-bg {
      fill: #111111;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    
    .project-title {
      font-size: 18px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    
    .project-desc {
      font-size: 13px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.1px;
    }
    
    .badge-bg {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    
    .badge-text {
      font-size: 11px;
      font-weight: 500;
    }
    
    .action-bg {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1;
    }
    
    .action-text {
      font-size: 12px;
      font-weight: 500;
      fill: #FFFFFF;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="148" rx="12" class="card-bg" />

  <!-- Content Group -->
  <g class="font-inter" transform="translate(32, 28)">
    <!-- Terminal/Code Icon -->
    <path d="M 4 8 L 0 12 L 4 16 M 16 8 L 20 12 L 16 16 M 12 4 L 8 20" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Title -->
    <text x="36" y="16" class="project-title">Code Quest</text>
    
    <!-- Description -->
    <text x="0" y="48" class="project-desc">Interactive gamified coding arena for competitive programmers. Users solve DSA problems,</text>
    <text x="0" y="68" class="project-desc">receive execution metrics (runtime/memory profiling), and unlock badges upon completion.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 92)">
      <!-- Java Badge -->
      <rect width="50" height="24" rx="12" class="badge-bg" />
      <text x="25" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Java</text>

      <!-- Spring Boot Badge -->
      <g transform="translate(58, 0)">
        <rect width="85" height="24" rx="12" class="badge-bg" />
        <text x="42.5" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">Spring Boot</text>
      </g>

      <!-- MySQL Badge -->
      <g transform="translate(151, 0)">
        <rect width="58" height="24" rx="12" class="badge-bg" />
        <text x="29" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">MySQL</text>
      </g>

      <!-- React Badge -->
      <g transform="translate(217, 0)">
        <rect width="58" height="24" rx="12" class="badge-bg" />
        <text x="29" y="16" text-anchor="middle" class="badge-text" fill="#E2E8F0">React</text>
      </g>
    </g>

    <!-- Action Button (Right Aligned) -->
    <g transform="translate(560, 32)">
      <rect width="130" height="32" rx="16" class="action-bg" />
      <text x="65" y="21" text-anchor="middle" class="action-text">View Repository →</text>
    </g>
  </g>
</svg>
