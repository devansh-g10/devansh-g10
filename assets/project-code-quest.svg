<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="150" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&amp;display=swap');
    .font-outfit {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-bg {
      fill: #0D1527;
      fill-opacity: 0.8;
      stroke: url(#border-grad);
      stroke-width: 1.5;
    }
    .project-title {
      font-size: 18px;
      font-weight: 800;
      fill: #ffffff;
    }
    .project-desc {
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-bg {
      fill: #1e293b;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 1;
    }
    .badge-text {
      font-size: 11px;
      font-weight: 500;
      fill: #3b82f6;
    }
    .action-bg {
      fill: #06b6d4;
      fill-opacity: 0.1;
      stroke: #06b6d4;
      stroke-opacity: 0.3;
      stroke-width: 1;
    }
    .action-text {
      font-size: 12px;
      font-weight: 600;
      fill: #06b6d4;
    }
  </style>

  <defs>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="778" height="148" rx="16" class="card-bg" />

  <!-- Content Group -->
  <g class="font-outfit" transform="translate(32, 28)">
    <!-- Terminal/Code Icon -->
    <path d="M 4 8 L 0 12 L 4 16 M 16 8 L 20 12 L 16 16 M 12 4 L 8 20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    
    <!-- Title -->
    <text x="36" y="16" class="project-title">Code Quest</text>
    
    <!-- Description -->
    <text x="0" y="48" class="project-desc">Interactive gamified coding arena for competitive programmers. Users solve DSA problems,</text>
    <text x="0" y="68" class="project-desc">receive execution metrics (runtime/memory profiling), and unlock badges upon completion.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 88)">
      <!-- Java Badge -->
      <rect width="50" height="22" rx="11" class="badge-bg" />
      <text x="25" y="15" text-anchor="middle" class="badge-text" fill="#ED8B00">Java</text>

      <!-- Spring Boot Badge -->
      <g transform="translate(58, 0)">
        <rect width="85" height="22" rx="11" class="badge-bg" />
        <text x="42.5" y="15" text-anchor="middle" class="badge-text" fill="#6DB33F">Spring Boot</text>
      </g>

      <!-- MySQL Badge -->
      <g transform="translate(151, 0)">
        <rect width="58" height="22" rx="11" class="badge-bg" />
        <text x="29" y="15" text-anchor="middle" class="badge-text" fill="#00758F">MySQL</text>
      </g>

      <!-- React Badge -->
      <g transform="translate(217, 0)">
        <rect width="58" height="22" rx="11" class="badge-bg" />
        <text x="29" y="15" text-anchor="middle" class="badge-text" fill="#61DAFB">React</text>
      </g>
    </g>

    <!-- Action Button (Right Aligned) -->
    <g transform="translate(560, 32)">
      <rect width="130" height="32" rx="16" class="action-bg" />
      <text x="65" y="20" text-anchor="middle" class="action-text">View Repository →</text>
    </g>
  </g>
</svg>
